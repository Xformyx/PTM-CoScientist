services:
  coscientist-api:
    build: .
    image: ptm-coscientist-api
    container_name: ptm-coscientist-api
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-gemma3:27b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHROMADB_URL=${CHROMADB_URL:-http://host.docker.internal:8000}
      - DATABASE_URL=${DATABASE_URL:-}
      - PTM_ARTIFACTS_DIR=/data/ptm-platform/outputs
      - COSCIENTIST_OUTPUT_DIR=/data/coscientist/outputs
    volumes:
      # Mount PTM-platform outputs as read-only
      - ${PTM_PLATFORM_DATA_DIR:-../PTM-platform/data/outputs}:/data/ptm-platform/outputs:ro
      # Output directory for Co-Scientist results
      - ./data/outputs:/data/coscientist/outputs
    networks:
      - default
      - ptm-platform-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  coscientist-webui:
    build: .
    image: ptm-coscientist-api
    container_name: ptm-coscientist-webui
    command: streamlit run webui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - COSCIENTIST_API_URL=http://coscientist-api:8080
    depends_on:
      - coscientist-api
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  ptm-platform-network:
    external: true
    name: ptm-platform-network
