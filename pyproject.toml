[project]
name = "ptm-coscientist"
version = "0.1.0"
description = "AI Co-Scientist for PTM research: hypothesis generation, debate, and experiment design"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "requests>=2.31",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "streamlit>=1.35",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
coscientist = "src.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"
